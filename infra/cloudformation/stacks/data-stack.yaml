AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  APIP data (DynamoDB). No compute dependencies. Deploy in parallel with messaging-stack.
  Fixed resource names per account; one AWS account per environment.

Resources:
  ApipCoreTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: apip-core
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ApipAuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: apip-audit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

Outputs:
  CoreTableName:
    Description: Core single-table name
    Value: !Ref ApipCoreTable
    Export:
      Name: apip-core-table-name
  CoreTableArn:
    Description: Core table ARN
    Value: !GetAtt ApipCoreTable.Arn
    Export:
      Name: apip-core-table-arn
  AuditTableName:
    Description: Audit append-only table name
    Value: !Ref ApipAuditTable
    Export:
      Name: apip-audit-table-name
  AuditTableArn:
    Description: Audit table ARN
    Value: !GetAtt ApipAuditTable.Arn
    Export:
      Name: apip-audit-table-arn
