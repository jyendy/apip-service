AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  APIP S3 bucket for Lambda ZIP artifacts. No dependencies; deploy in parallel with
  data-stack and messaging-stack.

Resources:
  LambdaArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

Outputs:
  ArtifactsBucketName:
    Description: Bucket name for lambda.zip (LambdaCodeBucket parameter in api-stack)
    Value: !Ref LambdaArtifactsBucket
    Export:
      Name: apip-lambda-artifacts-bucket-name
  ArtifactsBucketArn:
    Description: Bucket ARN
    Value: !GetAtt LambdaArtifactsBucket.Arn
    Export:
      Name: apip-lambda-artifacts-bucket-arn
