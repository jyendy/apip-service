AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  APIP HTTP API, Lambda, JWT (Cognito), execution role. ImportValue from data,
  cognito-stack (pool + app client). La Lambda API debe poder PutEvents al bus
  default (EVENT_BUS_NAME=default): añadir events:PutEvents en el rol de ejecución (IAM).

Parameters:
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment ZIP.
  LambdaCodeKey:
    Type: String
    Description: S3 key of the Lambda deployment ZIP.
  ApiCustomDomainName:
    Type: String
    Default: ''
    Description: Optional custom domain for HTTP API (e.g. api-dev.fincora.io).
  ApiCustomDomainCertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN in same region as API.
  DocumentsBucketName:
    Type: String
    Default: ''
    Description: S3 bucket for documents (pre-signed PUT/GET). Dejar vacío hasta crear el bucket.
  PlatformAdminGroupNames:
    Type: String
    Default: 'apip-platform-admin,admin'
    Description: >-
      Grupo(s) Cognito con acceso a /v1/admin/*. Varios nombres separados por coma. En producción suele bastar
      apip-platform-admin; incluir admin si el pool usa ese nombre para superusuarios.

Conditions:
  HasApiCustomDomainName: !Not [!Equals [!Ref ApiCustomDomainName, '']]
  HasApiCustomDomainCertificateArn: !Not [!Equals [!Ref ApiCustomDomainCertificateArn, '']]
  HasApiCustomDomain:
    !And [!Condition HasApiCustomDomainName, !Condition HasApiCustomDomainCertificateArn]

Resources:
  ApipApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: apip-api
      Runtime: nodejs20.x
      Handler: lambda.handler
      # Rol estándar definido en apip-policies (en vez de un rol inline específico aquí).
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/AWSAPIPLambdaExecutionRole'
      Timeout: 29
      MemorySize: 512
      Environment:
        Variables:
          APIP_TABLE_NAME:
            Fn::ImportValue: apip-core-table-name
          APIP_AUDIT_TABLE_NAME:
            Fn::ImportValue: apip-audit-table-name
          APIP_ACCESS_ROLES_TABLE_NAME:
            Fn::ImportValue: apip-access-roles-table-name
          APIP_USER_PROFILES_TABLE_NAME:
            Fn::ImportValue: apip-user-profiles-table-name
          EVENT_BUS_NAME: default
          ALLOW_DEV_TENANT_HEADER: 'false'
          PLATFORM_ADMIN_GROUP: !Ref PlatformAdminGroupNames
          APIP_DOCUMENTS_BUCKET_NAME: !Ref DocumentsBucketName
          COGNITO_USER_POOL_ID:
            Fn::ImportValue: apip-cognito-user-pool-id
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey

  ApipHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: apip-http
      ProtocolType: HTTP
      CorsConfiguration:
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - PUT
          - OPTIONS
        AllowOrigins:
          - '*'
        MaxAge: 86400

  ApipJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref ApipHttpApi
      Name: apip-cognito-jwt
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - Fn::ImportValue: apip-cognito-app-client-id
        Issuer: !Sub
          - 'https://cognito-idp.${AWS::Region}.amazonaws.com/${PoolId}'
          - PoolId: !ImportValue apip-cognito-user-pool-id

  ApipLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApipHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApipApiFunction.Arn
      PayloadFormatVersion: '2.0'
      IntegrationMethod: POST

  # Sin JWT: health. Preflight CORS lo responde API Gateway (CorsConfiguration).
  ApipHealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /health
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApipLambdaIntegration}'

  # Preflight explícito para clientes web / SPA bajo /v1 (navegadores; apps nativas suelen no usar CORS).
  ApipOptionsV1ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: OPTIONS /v1/{proxy+}
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApipLambdaIntegration}'

  # Onboarding público (website/signup) sin JWT.
  ApipPublicRoutePostV1OnboardingRequests:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: POST /v1/public/onboarding-requests
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApipLambdaIntegration}'

  # Rutas explícitas (JWT) — sin ANY /{proxy+}. CORS vía CorsConfiguration en ApipHttpApi.
  ApipJwtRouteGetV1Assets:
