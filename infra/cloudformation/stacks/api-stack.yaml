AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  APIP HTTP API, Lambda, JWT (Cognito), execution role. ImportValue from data,
  messaging, cognito-stack (pool + app client).

Parameters:
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment ZIP.
  LambdaCodeKey:
    Type: String
    Description: S3 key of the Lambda deployment ZIP.
  ApiCustomDomainName:
    Type: String
    Default: ''
    Description: Optional custom domain for HTTP API (e.g. api-dev.fincora.io).
  ApiCustomDomainCertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN in same region as API.

Conditions:
  HasApiCustomDomainName: !Not [!Equals [!Ref ApiCustomDomainName, '']]
  HasApiCustomDomainCertificateArn: !Not [!Equals [!Ref ApiCustomDomainCertificateArn, '']]
  HasApiCustomDomain:
    !And [!Condition HasApiCustomDomainName, !Condition HasApiCustomDomainCertificateArn]

Resources:
  ApipApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: apip-api
      Runtime: nodejs20.x
      Handler: lambda.handler
      # Rol estándar definido en apip-policies (en vez de un rol inline específico aquí).
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/AWSAPIPLambdaExecutionRole'
      Timeout: 29
      MemorySize: 512
      Environment:
        Variables:
          APIP_TABLE_NAME:
            Fn::ImportValue: apip-core-table-name
          APIP_AUDIT_TABLE_NAME:
            Fn::ImportValue: apip-audit-table-name
          EVENT_BUS_NAME:
            Fn::ImportValue: apip-event-bus-name
          ALLOW_DEV_TENANT_HEADER: 'false'
          PLATFORM_ADMIN_GROUP: apip-platform-admin
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey

  ApipHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: apip-http
      ProtocolType: HTTP
      CorsConfiguration:
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - PUT
          - OPTIONS
        AllowOrigins:
          - '*'
        MaxAge: 86400

  ApipJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref ApipHttpApi
      Name: apip-cognito-jwt
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - Fn::ImportValue: apip-cognito-app-client-id
        Issuer: !Sub
          - 'https://cognito-idp.${AWS::Region}.amazonaws.com/${PoolId}'
          - PoolId: !ImportValue apip-cognito-user-pool-id

  ApipLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApipHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApipApiFunction.Arn
      PayloadFormatVersion: '2.0'
      IntegrationMethod: POST

  # Sin JWT: health. Preflight CORS lo responde API Gateway (CorsConfiguration).
  ApipHealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /health
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApipLambdaIntegration}'

  # Preflight explícito para clientes web / SPA bajo /v1 (navegadores; apps nativas suelen no usar CORS).
  ApipOptionsV1ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: OPTIONS /v1/{proxy+}
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApipLambdaIntegration}'

  # Rutas explícitas (JWT) — sin ANY /{proxy+}. CORS vía CorsConfiguration en ApipHttpApi.
  ApipJwtRouteGetV1Assets:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/assets
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRoutePostV1Assets:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: POST /v1/assets
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1AssetsId:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/assets/{assetId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRoutePatchV1AssetsId:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: PATCH /v1/assets/{assetId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteDeleteV1AssetsId:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: DELETE /v1/assets/{assetId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1AssetsMetrics:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/assets/{assetId}/metrics
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1AssetsCashflow:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/assets/{assetId}/cashflow
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRoutePutV1AssetsCashFlows:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: PUT /v1/assets/{assetId}/cash-flows
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1AssetsStructure:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/assets/{assetId}/structure
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1Portfolios:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/portfolios
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRoutePostV1Portfolios:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: POST /v1/portfolios
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1PortfoliosId:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/portfolios/{portfolioId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRoutePatchV1PortfoliosId:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: PATCH /v1/portfolios/{portfolioId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1PortfoliosMetrics:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/portfolios/{portfolioId}/metrics
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1PortfoliosCashflow:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/portfolios/{portfolioId}/cashflow
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1PortfoliosPerformance:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/portfolios/{portfolioId}/performance
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1Projects:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/projects
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRoutePostV1Projects:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: POST /v1/projects
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1ProjectsId:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/projects/{projectId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRoutePatchV1ProjectsId:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: PATCH /v1/projects/{projectId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1ProjectsMetrics:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/projects/{projectId}/metrics
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1ProjectsCashflow:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/projects/{projectId}/cashflow
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1DashboardExecutive:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/dashboard/executive
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1Insights:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/insights
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRoutePostV1ImportsAssets:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: POST /v1/imports/assets
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1ImportsAssetsJob:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/imports/assets/{jobId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRoutePostV1Simulations:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: POST /v1/simulations
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1Simulations:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/simulations
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1SimulationsId:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/simulations/{simulationId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRoutePatchV1SimulationsId:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: PATCH /v1/simulations/{simulationId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteDeleteV1SimulationsId:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: DELETE /v1/simulations/{simulationId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1Alerts:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/alerts
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'

  # Admin plataforma (mismo JWT; Lambda valida grupo Cognito / claim — ver PLATFORM_ADMIN_GROUP).
  ApipJwtRouteGetV1AdminTenants:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/admin/tenants
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRoutePostV1AdminTenants:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: POST /v1/admin/tenants
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRouteGetV1AdminTenantsId:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: GET /v1/admin/tenants/{tenantId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'
  ApipJwtRoutePatchV1AdminTenantsId:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApipHttpApi
      RouteKey: PATCH /v1/admin/tenants/{tenantId}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApipJwtAuthorizer
      Target: !Sub 'integrations/${ApipLambdaIntegration}'

  ApipStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApipHttpApi
      StageName: $default
      AutoDeploy: true

  ApipCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasApiCustomDomain
    Properties:
      DomainName: !Ref ApiCustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCustomDomainCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApipCustomDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasApiCustomDomain
    Properties:
      ApiId: !Ref ApipHttpApi
      DomainName: !Ref ApipCustomDomain
      Stage: !Ref ApipStage

  ApipPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApipApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApipHttpApi}/*/*/*'

Outputs:
  HttpApiUrl:
    Description: HTTP API base URL
    Value: !GetAtt ApipHttpApi.ApiEndpoint
    Export:
      Name: apip-http-api-url
  ApiFunctionArn:
    Description: API Lambda function ARN
    Value: !GetAtt ApipApiFunction.Arn
    Export:
      Name: apip-api-function-arn
  ApiCustomDomainRegionalName:
    Condition: HasApiCustomDomain
    Description: Regional domain target to create CNAME in external DNS.
    Value: !GetAtt ApipCustomDomain.RegionalDomainName
  ApiCustomDomainHostedZoneId:
    Condition: HasApiCustomDomain
    Description: Hosted zone id for alias records (Route53 only).
    Value: !GetAtt ApipCustomDomain.RegionalHostedZoneId
