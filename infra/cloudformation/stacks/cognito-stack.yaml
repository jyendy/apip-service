AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  APIP Cognito User Pool and app client (JWT for HTTP API). No dependency on other stacks.

Resources:
  ApipUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: apip-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: custom:tenantId
          AttributeDataType: String
          Mutable: true
          Required: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      MfaConfiguration: 'OFF'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  ApipUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: apip-app-client
      UserPoolId: !Ref ApipUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  ApipPlatformAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: apip-platform-admin
      Description: Plataforma root admin para rutas /v1/admin/*
      UserPoolId: !Ref ApipUserPool

Outputs:
  UserPoolId:
    Description: User Pool ID (JWT issuer)
    Value: !Ref ApipUserPool
    Export:
      Name: apip-cognito-user-pool-id
  UserPoolClientId:
    Description: App client ID (ID token aud claim)
    Value: !Ref ApipUserPoolClient
    Export:
      Name: apip-cognito-app-client-id
  PlatformAdminGroupName:
    Description: Grupo de admin de plataforma para apip-service
    Value: !Ref ApipPlatformAdminGroup
